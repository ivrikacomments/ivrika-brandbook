tRatio="xMidYMid meet" opacity="1"/><text x="120" y="91" fill="#7B283A" font-family="FM" font-size="26" text-anchor="start">ИВРИКА / РЕЧЕВАЯ ПРАКТИКА</text><text x="120" y="217" fill="#7B283A" font-family="FB" font-size="76" text-anchor="start">Как начать отвечать на иврите?</text><text x="120" y="324" fill="#C56535" font-family="FB" font-size="49" text-anchor="start">Как дела?</text><rect x="120" y="370" width="445" height="213" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="342" y="414" fill="#7B283A" font-family="FM" font-size="32" text-anchor="middle">К мужчине</text><text x="342" y="487" fill="#7B283A" font-family="FB" font-size="62" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">מַה שְׁלוֹמְךָ?</text><text x="342" y="542" fill="#A35332" font-family="FM" font-size="34" text-anchor="middle">ма шломхА?</text><rect x="605" y="370" width="445" height="213" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="827" y="414" fill="#7B283A" font-family="FM" font-size="32" text-anchor="middle">К женщине</text><text x="827" y="487" fill="#7B283A" font-family="FB" font-size="62" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">מַה שְׁלוֹמֵךְ?</text><text x="827" y="542" fill="#A35332" font-family="FM" font-size="34" text-anchor="middle">ма шломЭх?</text><image href="assets/images/cafe.png" x="1110" y="348" width="690" height="460" preserveAspectRatio="xMidYMid meet" opacity="1"/><rect x="120" y="641" width="290" height="147" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="265" y="706" fill="#7B283A" font-family="FB" font-size="57" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">טוֹב</text><text x="265" y="756" fill="#66513C" font-family="FR" font-size="32" text-anchor="middle">Хорошо</text><rect x="440" y="641" width="290" height="147" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="585" y="706" fill="#7B283A" font-family="FB" font-size="57" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">בְּסֵדֶר</text><text x="585" y="756" fill="#66513C" font-family="FR" font-size="32" text-anchor="middle">Нормально</text><rect x="760" y="641" width="290" height="147" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="905" y="706" fill="#7B283A" font-family="FB" font-size="57" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">תּוֹדָה</text><text x="905" y="756" fill="#66513C" font-family="FR" font-size="32" text-anchor="middle">Спасибо</text><line x1="120" y1="848" x2="1800" y2="848" stroke="#C56535" stroke-width="3" stroke-linecap="round"/><text x="120" y="924" fill="#7B283A" font-family="FB" font-size="49" text-anchor="start">Послушайте вопрос и ответьте вслух</text><line x1="120" y1="1005" x2="1800" y2="1005" stroke="#E5CDAE" stroke-width="2" stroke-linecap="round"/><text x="120" y="1047" fill="#7B283A" font-family="FR" font-size="27" text-anchor="start">@ivrit_ivrika</text><text x="1520" y="1047" fill="#94795E" font-family="FR" font-size="26" text-anchor="start">ivrika.ru</text><text x="1800" y="1047" fill="#7B283A" font-family="FR" font-size="26" text-anchor="end">04 / 04</text></svg><text x="725" y="177" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Экран 1920 × 1080</text><text x="725" y="216" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Текст слева, печатная сцена</text><text x="725" y="237.45" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">справа. На широком экране</text><text x="725" y="258.9" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">увеличиваем свободное поле</text><text x="725" y="280.34999999999997" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">и ширину колонок.</text><text x="725" y="373" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Общие правила</text><text x="725" y="412" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Rubik, тёплая палитра, целая</text><text x="725" y="433.45" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">эмблема и один следующий</text><text x="725" y="454.9" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">шаг. Квадратный слайд не</text><text x="725" y="476.34999999999997" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">растягиваем.</text><text x="48" y="550" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Макеты переработаны под принятый стиль. Редактируемые примеры четырёх слайдов сохранены отдельно в «Примеры слайдов.html».</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">22</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Человеческое лицо школы"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ФОТО</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Человеческое лицо школы</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Реальные фотографии из папки «БРЭНД ГРАНАТ».</text><image href="assets/images/photo.jpg" x="48" y="146" width="325" height="325" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="assets/images/portrait.webp" x="393" y="146" width="238" height="325" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="681" y="172" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Настроение</text><text x="681" y="211" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Тёплый естественный свет,</text><text x="681" y="233.88" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">спокойный контакт, живая среда.</text><text x="681" y="256.76" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Портрет преподавателя</text><text x="681" y="279.64" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">поддерживает личное доверие.</text><text x="681" y="363" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Обработка</text><text x="681" y="402" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Сохраняем лицо, оттенок кожи и</text><text x="681" y="424.88" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">естественную фактуру. Избегаем</text><text x="681" y="447.76" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">сильных фильтров и цветового</text><text x="681" y="470.64" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">шума.</text><rect x="48" y="494" width="583" height="64" rx="14" fill="#F4EBDD" stroke="none" stroke-width="1"/><text x="66" y="519" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Гранатовый сад и зелень уже встречаются в фотографиях. Это естественная</text><text x="66" y="539" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">связь с символикой бренда.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">23</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Ubuntu + Montserrat в интерфейсе"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">САЙТ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Ubuntu + Montserrat в интерфейсе</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Схематичный образец применения бренда. Это не проект нового сайта и не готовая страница.</text><rect x="48" y="146" width="633" height="362" rx="16" fill="#FFFFFF" stroke="#DFD4C6" stroke-width="1"/><rect x="49" y="147" width="631" height="50" rx="15" fill="#FAF6ED" stroke="none" stroke-width="1"/><image href="assets/images/logo.png" x="68" y="151" width="42" height="42" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="121" y="179" fill="#7B283A" font-family="FUB" font-size="17" text-anchor="start">ИВРИКА</text><text x="361" y="178" fill="#32272B" font-family="FMR" font-size="12" text-anchor="start">Обучение    О школе    Материалы</text><rect x="49" y="198" width="631" height="228" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="76" y="232" fill="#7B283A" font-family="FMR" font-size="14" text-anchor="start">Онлайн-школа иврита</text><text x="76" y="278" fill="#7B283A" font-family="FUB" font-size="29" text-anchor="start">Иврит для жизни</text><text x="76" y="315" fill="#32272B" font-family="FMR" font-size="18" text-anchor="start">Изучайте язык, общайтесь</text><text x="76" y="340" fill="#32272B" font-family="FMR" font-size="18" text-anchor="start">и замечайте свой прогресс.</text><rect x="76" y="375" width="194" height="34" rx="9" fill="#7B283A" stroke="none" stroke-width="1"/><text x="173" y="398" fill="#FAF6ED" font-family="FMR" font-size="14" text-anchor="middle">Выбрать обучение</text><image href="assets/images/logo.png" x="487" y="225" width="155" height="155" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="76" y="456" fill="#7B283A" font-family="FUB" font-size="22" text-anchor="start">Понятный путь обучения</text><text x="76" y="487" fill="#32272B" font-family="FMR" font-size="15" text-anchor="start">Короткое объяснение и один следующий шаг.</text><rect x="711" y="146" width="241" height="362" rx="20" fill="#FFFFFF" stroke="#DFD4C6" stroke-width="1"/><rect x="712" y="147" width="239" height="235" rx="20" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="732" y="184" fill="#7B283A" font-family="FUB" font-size="14" text-anchor="start">ИВРИКА</text><image href="assets/images/logo.png" x="887" y="159" width="45" height="45" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="732" y="240" fill="#7B283A" font-family="FUB" font-size="28" text-anchor="start">Иврит</text><text x="732" y="275" fill="#7B283A" font-family="FUB" font-size="28" text-anchor="start">для жизни</text><text x="732" y="307" fill="#32272B" font-family="FMR" font-size="14" text-anchor="start">Короткий текст, который</text><text x="732" y="328" fill="#32272B" font-family="FMR" font-size="14" text-anchor="start">легко прочитать с</text><text x="732" y="349" fill="#32272B" font-family="FMR" font-size="14" text-anchor="start">телефона.</text><rect x="732" y="380" width="201" height="35" rx="9" fill="#7B283A" stroke="none" stroke-width="1"/><text x="832" y="403" fill="#FAF6ED" font-family="FMR" font-size="14" text-anchor="middle">Выбрать обучение</text><text x="732" y="448" fill="#32272B" font-family="FMR" font-size="14" text-anchor="start">Обучение</text><text x="732" y="470" fill="#32272B" font-family="FMR" font-size="14" text-anchor="start">О школе</text><text x="732" y="492" fill="#32272B" font-family="FMR" font-size="14" text-anchor="start">Материалы</text><text x="48" y="550" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Заголовки Ubuntu. Текст и кнопки Montserrat. Светлый фон и бордовый главный акцент. Соседние секции одного фона не складывают два вертикальных отступа.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">24</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Говорим ясно и с поддержкой"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ГОЛОС БРЕНДА</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Говорим ясно и с поддержкой</text><rect x="48" y="148" width="284" height="137" rx="18" fill="#F4EBDD" stroke="none" stroke-width="1"/><text x="68" y="179" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Понятно</text><text x="68" y="216" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Одна мысль в предложении.</text><text x="68" y="236" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Термины объясняем на примере.</text><rect x="354" y="148" width="286" height="137" rx="18" fill="#E3E2C6" stroke="none" stroke-width="1"/><text x="374" y="179" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">По делу</text><text x="374" y="216" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Показываем, что человек изучит и</text><text x="374" y="236" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">что сможет потренировать.</text><rect x="662" y="148" width="290" height="137" rx="18" fill="#F3E5C9" stroke="none" stroke-width="1"/><text x="682" y="179" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Без давления</text><text x="682" y="216" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Приглашаем попробовать и</text><text x="682" y="236" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">поддерживаем следующий шаг.</text><text x="48" y="333" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Вместо общей формулировки</text><text x="48" y="375" fill="#615B60" font-family="FR" font-size="20" text-anchor="start">«Уникальная методика для стремительного прорыва»</text><text x="48" y="430" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Конкретное действие</text><text x="48" y="472" fill="#7B283A" font-family="FM" font-size="25" text-anchor="start">«Послушайте фразу и ответьте вслух»</text><text x="48" y="534" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Результаты учеников, сроки, цифры, отзывы, акции и гарантии публикуем только после проверки. Не обещаем результат,</text><text x="48" y="555.45" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">который не подтверждён.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">25</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Как должны выглядеть рабочие тетради"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ТЕТРАДИ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Как должны выглядеть рабочие тетради</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Кратко по скиллу ivrika-workbook-pdf и вложенному согласованному образцу.</text><image href="assets/images/workbook.png" x="48" y="146" width="286" height="405" preserveAspectRatio="xMidYMid meet" opacity="1"/><circle cx="377" cy="158" r="3" fill="#7B283A"/><text x="392" y="163" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">A4. Белая и светло-бежевая основа, бордовые основные заголовки, тёмно-серые</text><text x="392" y="183.02" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">текст и подзаголовки. Тонкие разделители и единые поля.</text><circle cx="377" cy="208.04000000000002" r="3" fill="#7B283A"/><text x="392" y="213.04000000000002" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Больше воздуха между упражнениями и достаточно места для ответов. Целое</text><text x="392" y="233.06000000000003" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">задание лучше перенести, чем сжимать страницу.</text><circle cx="377" cy="258.08000000000004" r="3" fill="#7B283A"/><text x="392" y="263.08000000000004" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Иврит справа налево. Крупные речевые фразы 17-20 pt; реплики 15,5-17 pt;</text><text x="392" y="283.1" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">пояснения 12-14 pt. Точные размеры сверять по рендеру.</text><circle cx="377" cy="308.12" r="3" fill="#7B283A"/><text x="392" y="313.12" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Мягкие фактурные рисунки, близкие к акварели и карандашу. Комикс читается</text><text x="392" y="333.14" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">справа налево внутри ряда. Реплики набираются точным текстом.</text><circle cx="377" cy="358.15999999999997" r="3" fill="#7B283A"/><text x="392" y="363.15999999999997" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Содержание и порядок сохраняются. Ученические инструкции берутся на иврите</text><text x="392" y="383.17999999999995" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">из исходника. Новые упражнения, переводы, транскрипция и огласовки не</text><text x="392" y="403.19999999999993" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">добавляются.</text><circle cx="377" cy="428.2199999999999" r="3" fill="#7B283A"/><text x="392" y="433.2199999999999" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">На каждой странице спокойный серый футер: школа и автор, блог, e-mail,</text><text x="392" y="453.2399999999999" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">WhatsApp и номер страницы. Ссылки активны.</text><text x="374" y="489" fill="#615B60" font-family="FR" font-size="12" text-anchor="start">Полная фруктовая рамка на каждой странице тетради не требуется. Русский перевод</text><text x="374" y="506" fill="#615B60" font-family="FR" font-size="12" text-anchor="start">допускается в разрешённых словарных и справочных блоках.</text><text x="48" y="557" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Футер: Школа ИВРИКА / Виктория Ярмолинская; ivrika.ru; support@ivrika.ru; WhatsApp +972 55-507-2690; номер страницы / всего страниц.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">26</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Актуальные эталоны и исходники"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">МАТЕРИАЛЫ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Актуальные эталоны и исходники</text><text x="48" y="158" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Основа версии 2.1</text><circle cx="51" cy="194" r="3" fill="#7B283A"/><text x="66" y="199" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Скилл ivrika-social-visuals: визуальная техника, цветовые роли, предметы,</text><text x="66" y="219.02" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">персонажи и макет.</text><circle cx="51" cy="245.04000000000002" r="3" fill="#7B283A"/><text x="66" y="250.04000000000002" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">cafe.png: принятая кудрявая пара в кафе. characters-pair.png: та же пара в</text><text x="66" y="270.06" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">другом сюжете. scene-jerusalem.png: минимальная сцена.</text><circle cx="51" cy="296.08" r="3" fill="#7B283A"/><text x="66" y="301.08" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">layout-cover.png и layout-word.png: устройство карточек. object-pumpkin.png:</text><text x="66" y="321.09999999999997" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">техника отдельного предмета.</text><circle cx="51" cy="347.11999999999995" r="3" fill="#7B283A"/><text x="66" y="352.11999999999995" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Оригинальный logo.png, Rubik Regular / Medium / Bold, paper-grain.svg и две</text><text x="66" y="372.13999999999993" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">пиктограммы рода.</text><circle cx="51" cy="398.1599999999999" r="3" fill="#7B283A"/><text x="66" y="403.1599999999999" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Тетради: отдельный скилл ivrika-workbook-pdf и его образец. Фото и</text><text x="66" y="423.1799999999999" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">дополнительный логотип: существующие материалы школы.</text><image href="assets/images/cover.png" x="658" y="170" width="132" height="176" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="assets/images/word.png" x="813" y="170" width="132" height="176" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="658" y="391" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Версия обновлена 01.11.2026.</text><text x="658" y="414" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Используется принятая кудрявая</text><text x="658" y="437" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">пара в кафе. Добавлены</text><text x="658" y="460" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">переработанные примеры</text><text x="658" y="483" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">презентаций.</text><text x="48" y="557" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Локальные копии актуальных изображений сохранены в assets; реестр источников в sources.json. Прежняя версия брендбука сохранена отдельно в versions.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">27</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Проверка перед выпуском"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ПАМЯТКА</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Проверка перед выпуском</text><rect x="48" y="146" width="438" height="165" rx="18" fill="#F4EBDD" stroke="none" stroke-width="1"/><text x="68" y="177" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Стиль и символы</text><text x="68" y="214" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Сухая печать и резные формы видны.</text><text x="68" y="234" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Светлый фон остаётся главным.</text><text x="68" y="254" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Гранат и апельсин сохраняют свою роль.</text><text x="68" y="274" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Логотип целый, оригинальный.</text><rect x="510" y="146" width="442" height="165" rx="18" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="530" y="177" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Текст и род</text><text x="530" y="214" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Точный иврит, изолированный RTL.</text><text x="530" y="234" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Транскрипция и перевод читаются.</text><text x="530" y="254" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Показана одна нужная фигурка рода.</text><text x="530" y="274" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Футер не перекрывает рисунок.</text><rect x="48" y="332" width="438" height="166" rx="18" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="68" y="363" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Иллюстрация</text><text x="68" y="400" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Один главный предмет или сюжет.</text><text x="68" y="420" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Пара узнаваема; анатомия проверена.</text><text x="68" y="440" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Края целые, без обрезанных деталей.</text><text x="68" y="460" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Прозрачность проверена на кремовом.</text><rect x="510" y="332" width="442" height="166" rx="18" fill="#F4EBDD" stroke="none" stroke-width="1"/><text x="530" y="363" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Носитель и экспорт</text><text x="530" y="400" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Соцсети: обычно 1080 × 1440.</text><text x="530" y="420" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Rubik; фон обложки или слова по роли.</text><text x="530" y="440" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Тетради сохраняют правила A4.</text><text x="530" y="460" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">PDF: шрифты внедрены, страницы проверены.</text><text x="48" y="546" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Сначала проверяют полный макет, затем читаемость в мобильном размере. Сезонная тема, число слов и CTA берутся только из текущего задания.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">28</text></svg></section></body></html>
