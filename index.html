</style></head><body><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label=""><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FFF5E4" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ФИРМЕННЫЙ СТИЛЬ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start"></text><text x="50" y="139" fill="#7B283A" font-family="FM" font-size="15" text-anchor="start">ОНЛАЙН-ШКОЛА ИВРИТА</text><text x="46" y="217" fill="#7B283A" font-family="FB" font-size="70" text-anchor="start">ИВРИКА</text><text x="49" y="270" fill="#7B283A" font-family="FM" font-size="35" text-anchor="start">Брендбук</text><text x="50" y="325" fill="#C56535" font-family="FB" font-size="27" text-anchor="start">Солнечный Израиль</text><text x="50" y="369" fill="#32272B" font-family="FR" font-size="20" text-anchor="start">Цвет, печатная иллюстрация</text><text x="50" y="397" fill="#32272B" font-family="FR" font-size="20" text-anchor="start">и правила учебного дизайна</text><image href="assets/images/logo.png" x="835" y="49" width="102" height="102" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="assets/images/cafe.png" x="485" y="183" width="467" height="330" preserveAspectRatio="xMidYMid meet" opacity="1"/><line x1="50" y1="446" x2="438" y2="446" stroke="#7B283A" stroke-width="1.5" stroke-linecap="round"/><text x="50" y="478" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Гранат и апельсин. Светлая основа.</text><text x="50" y="502" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Взрослая редакционная графика.</text><rect x="50" y="535" width="55" height="10" rx="0" fill="#7B283A" stroke="none" stroke-width="1"/><rect x="116" y="535" width="55" height="10" rx="0" fill="#C56535" stroke="none" stroke-width="1"/><rect x="182" y="535" width="55" height="10" rx="0" fill="#F19961" stroke="none" stroke-width="1"/><rect x="248" y="535" width="55" height="10" rx="0" fill="#A8AD63" stroke="none" stroke-width="1"/><rect x="314" y="535" width="55" height="10" rx="0" fill="#68AFAE" stroke="none" stroke-width="1"/><text x="949" y="555" fill="#615B60" font-family="FM" font-size="10" text-anchor="end">ВЕРСИЯ 2.1 / 01.11.2026</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">01</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Принятая концепция и область применения"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ОСНОВА</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Принятая концепция и область применения</text><rect x="48" y="146" width="438" height="307" rx="18" fill="#F4EBDD" stroke="none" stroke-width="1"/><text x="68" y="177" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Закреплённая основа</text><text x="68" y="214" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Соцсети: «Солнечный Израиль».</text><text x="68" y="234" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Сухая печать и резные формы.</text><text x="68" y="254" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Главный бордовый #7B283A.</text><text x="68" y="274" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Символы: гранат и апельсин.</text><text x="68" y="294" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Соцсети: Rubik.</text><text x="68" y="314" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Сайт: заголовки Ubuntu, текст Montserrat.</text><text x="68" y="334" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Оригинальная эмблема-гранат.</text><rect x="510" y="146" width="442" height="307" rx="18" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="530" y="177" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Как применять</text><text x="530" y="214" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Макеты и палитра соцсетей взяты из принятого скилла</text><text x="530" y="234" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">ivrika-social-visuals.</text><text x="530" y="254" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Тетради сохраняют отдельное согласованное оформление</text><text x="530" y="274" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">A4.</text><text x="530" y="294" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Дополнительные нормы охранного поля и адаптации</text><text x="530" y="314" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">отмечены как рекомендации.</text><text x="48" y="498" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Приоритет источников</text><text x="48" y="534" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Текущее задание и ваши уточнения &gt; эталоны «Солнечного Израиля» для соцсетей &gt; отдельные правила соответствующего</text><text x="48" y="554" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">носителя. Сезонные темы в примерах не становятся темой всех новых публикаций.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">02</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Солнечный Израиль"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ВИЗУАЛЬНЫЙ ЯЗЫК</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Солнечный Израиль</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Взрослая редакционная иллюстрация с характером линогравюры и сухой печати.</text><image href="assets/images/cafe.png" x="48" y="151" width="438" height="292" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="assets/images/pair.png" x="510" y="151" width="442" height="292" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="48" y="477" fill="#7B283A" font-family="FB" font-size="22" text-anchor="start">Кудрявая пара в кафе</text><text x="48" y="511" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Принятый вариант сцены: естественные кудри, оранжевая</text><text x="48" y="532" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">серьга, круглые очки, кремовый, терракотовый и</text><text x="48" y="553" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">оливковый. Сухая печать и резные светлые прорези.</text><text x="510" y="477" fill="#7B283A" font-family="FB" font-size="22" text-anchor="start">Та же пара в другом сюжете</text><text x="510" y="511" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Солнечный колорит, естественные кудри и свободная</text><text x="510" y="532" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">летняя одежда. Для новых сцен сохраняем лица и</text><text x="510" y="553" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">характерные детали этой пары.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">03</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Цветовая основа соцсетей"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ЦВЕТ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Цветовая основа соцсетей</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Цвета фона и текста закреплены за конкретными ролями.</text><rect x="48" y="145" width="289" height="77" rx="0" fill="#FFF5E4" stroke="#E5CDAE" stroke-width="1"/><text x="48" y="253" fill="#7B283A" font-family="FB" font-size="18" text-anchor="start">Фон обложки</text><text x="48" y="279" fill="#32272B" font-family="FM" font-size="15" text-anchor="start">#FFF5E4</text><text x="48" y="306" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Большое светлое поле.</text><rect x="355" y="145" width="289" height="77" rx="0" fill="#FFF9EF" stroke="#E5CDAE" stroke-width="1"/><text x="355" y="253" fill="#7B283A" font-family="FB" font-size="18" text-anchor="start">Фон слова</text><text x="355" y="279" fill="#32272B" font-family="FM" font-size="15" text-anchor="start">#FFF9EF</text><text x="355" y="306" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Чистая словарная карточка.</text><rect x="662" y="145" width="289" height="77" rx="0" fill="#7B283A" stroke="#E5CDAE" stroke-width="1"/><text x="662" y="253" fill="#7B283A" font-family="FB" font-size="18" text-anchor="start">Главный бордовый</text><text x="662" y="279" fill="#32272B" font-family="FM" font-size="15" text-anchor="start">#7B283A</text><text x="662" y="306" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Заголовок, иврит, логотип.</text><rect x="48" y="343" width="289" height="77" rx="0" fill="#C56535" stroke="#E5CDAE" stroke-width="1"/><text x="48" y="451" fill="#7B283A" font-family="FB" font-size="18" text-anchor="start">Терракотовый акцент</text><text x="48" y="477" fill="#32272B" font-family="FM" font-size="15" text-anchor="start">#C56535</text><text x="48" y="504" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Акцентная строка обложки.</text><rect x="355" y="343" width="289" height="77" rx="0" fill="#A35332" stroke="#E5CDAE" stroke-width="1"/><text x="355" y="451" fill="#7B283A" font-family="FB" font-size="18" text-anchor="start">Транскрипция</text><text x="355" y="477" fill="#32272B" font-family="FM" font-size="15" text-anchor="start">#A35332</text><text x="355" y="504" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Терракота из шаблона слова.</text><rect x="662" y="343" width="289" height="77" rx="0" fill="#66513C" stroke="#E5CDAE" stroke-width="1"/><text x="662" y="451" fill="#7B283A" font-family="FB" font-size="18" text-anchor="start">Русский перевод</text><text x="662" y="477" fill="#32272B" font-family="FM" font-size="15" text-anchor="start">#66513C</text><text x="662" y="504" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Спокойный тёмный песочный.</text><text x="48" y="556" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Допустимый кремовый внутри иллюстрации: #FAF6ED. Рисунок размещается на фоне карточки отдельным слоем; его окружение обычно прозрачное.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">04</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Рабочие сочетания и контраст"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ЦВЕТ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Рабочие сочетания и контраст</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Расчёт для сплошных HEX. На фактуре и поверх иллюстрации контраст проверяют отдельно.</text><rect x="48" y="150" width="200" height="36" rx="0" fill="#FFF5E4" stroke="none" stroke-width="1"/><text x="61" y="174" fill="#7B283A" font-family="FM" font-size="15" text-anchor="start">Иврит для жизни</text><text x="270" y="174" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Заголовок на обложке</text><text x="755" y="174" fill="#7B283A" font-family="FM" font-size="15" text-anchor="start">8,81:1</text><text x="848" y="174" fill="#7B283A" font-family="FM" font-size="12" text-anchor="start">для текста</text><rect x="48" y="198" width="200" height="36" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="61" y="222" fill="#7B283A" font-family="FM" font-size="15" text-anchor="start">Иврит для жизни</text><text x="270" y="222" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Иврит на карточке слова</text><text x="755" y="222" fill="#7B283A" font-family="FM" font-size="15" text-anchor="start">9,08:1</text><text x="848" y="222" fill="#7B283A" font-family="FM" font-size="12" text-anchor="start">для текста</text><rect x="48" y="246" width="200" height="36" rx="0" fill="#FFF5E4" stroke="none" stroke-width="1"/><text x="61" y="270" fill="#C56535" font-family="FM" font-size="15" text-anchor="start">Иврит для жизни</text><text x="270" y="270" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Акцентная строка обложки</text><text x="755" y="270" fill="#7B283A" font-family="FM" font-size="15" text-anchor="start">3,68:1</text><text x="848" y="270" fill="#7B283A" font-family="FM" font-size="12" text-anchor="start">крупный текст</text><rect x="48" y="294" width="200" height="36" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="61" y="318" fill="#A35332" font-family="FM" font-size="15" text-anchor="start">Иврит для жизни</text><text x="270" y="318" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Транскрипция</text><text x="755" y="318" fill="#7B283A" font-family="FM" font-size="15" text-anchor="start">5,22:1</text><text x="848" y="318" fill="#7B283A" font-family="FM" font-size="12" text-anchor="start">для текста</text><rect x="48" y="342" width="200" height="36" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="61" y="366" fill="#66513C" font-family="FM" font-size="15" text-anchor="start">Иврит для жизни</text><text x="270" y="366" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Русский перевод</text><text x="755" y="366" fill="#7B283A" font-family="FM" font-size="15" text-anchor="start">7,14:1</text><text x="848" y="366" fill="#7B283A" font-family="FM" font-size="12" text-anchor="start">для текста</text><rect x="48" y="390" width="200" height="36" rx="0" fill="#7B283A" stroke="none" stroke-width="1"/><text x="61" y="414" fill="#FFF5E4" font-family="FM" font-size="15" text-anchor="start">Иврит для жизни</text><text x="270" y="414" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Светлый текст на бордовом</text><text x="755" y="414" fill="#7B283A" font-family="FM" font-size="15" text-anchor="start">8,81:1</text><text x="848" y="414" fill="#7B283A" font-family="FM" font-size="12" text-anchor="start">для текста</text><rect x="48" y="438" width="200" height="36" rx="0" fill="#F19961" stroke="none" stroke-width="1"/><text x="61" y="462" fill="#FFFFFF" font-family="FM" font-size="15" text-anchor="start">Иврит для жизни</text><text x="270" y="462" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Белый на апельсиновом</text><text x="755" y="462" fill="#7B283A" font-family="FM" font-size="15" text-anchor="start">2,22:1</text><text x="848" y="462" fill="#7B283A" font-family="FM" font-size="12" text-anchor="start">не для текста</text><text x="48" y="520" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Фон доминирует по площади</text><text x="48" y="548" fill="#32272B" font-family="FR" font-size="12" text-anchor="start">Бордовый ведёт типографику. Терракота, олива и море работают как локальные акценты.</text><text x="48" y="565" fill="#32272B" font-family="FR" font-size="12" text-anchor="start">Тёмная одежда не поглощает повседневную сцену.</text><text x="663" y="523" fill="#615B60" font-family="FR" font-size="12" text-anchor="start">WCAG AA: от 4,5:1 для обычного текста; от 3:1 для</text><text x="663" y="540" fill="#615B60" font-family="FR" font-size="12" text-anchor="start">крупного. Источник: W3C, SC 1.4.3.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">05</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Оригинальная эмблема-гранат"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ЛОГОТИП</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Оригинальная эмблема-гранат</text><image href="assets/images/logo.png" x="80" y="143" width="350" height="350" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="assets/images/flat.png" x="558" y="143" width="350" height="350" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="48" y="507" fill="#7B283A" font-family="FB" font-size="21" text-anchor="start">Основная для соцсетей</text><text x="48" y="538" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Оригинальный logo.png из принятого скилла. Сохраняем целый</text><text x="48" y="558" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">рисунок, орнамент, пропорции и надписи.</text><text x="510" y="507" fill="#7B283A" font-family="FB" font-size="21" text-anchor="start">Дополнительная готовая версия</text><text x="510" y="538" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Существующий бордово-золотой файл. Его не подставляют</text><text x="510" y="558" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">вместо основной эмблемы в утверждённом шаблоне</text><text x="510" y="578" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">автоматически.</text><text x="48" y="128" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Рисунок логотипа не перерисовывают под печатную манеру иллюстраций и не перекрашивают автоматически под цвет текста.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">06</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Место логотипа и свободное поле"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ЛОГОТИП</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Место логотипа и свободное поле</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Сетка соцсетей взята из принятого шаблона. Охранное поле ниже является общей рекомендацией.</text><rect x="83" y="148" width="330" height="330" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><rect x="123" y="188" width="250" height="250" rx="0" fill="#FFF5E4" stroke="#7B283A" stroke-width="1"/><image href="assets/images/logo.png" x="123" y="188" width="250" height="250" preserveAspectRatio="xMidYMid meet" opacity="1"/><line x1="83" y1="169" x2="123" y2="169" stroke="#7B283A" stroke-width="1" stroke-linecap="round"/><text x="103" y="162" fill="#7B283A" font-family="FM" font-size="14" text-anchor="middle">x</text><line x1="393" y1="188" x2="393" y2="438" stroke="#7B283A" stroke-width="1" stroke-linecap="round"/><text x="405" y="322" fill="#7B283A" font-family="FM" font-size="14" text-anchor="start">H</text><text x="83" y="515" fill="#7B283A" font-family="FM" font-size="15" text-anchor="start">Рекомендация: x = 1/6 высоты знака</text><text x="83" y="544" fill="#32272B" font-family="FR" font-size="13" text-anchor="start">Поле считаем от видимого контура. Прозрачные края</text><text x="83" y="562" fill="#32272B" font-family="FR" font-size="13" text-anchor="start">PNG не являются частью рисунка.</text><circle cx="513" cy="163" r="3" fill="#7B283A"/><text x="528" y="168" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">На карточке 1080 × 1440 эмблема стоит справа сверху:</text><text x="528" y="189.45" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">114 × 114 px; справа 57 px, сверху 47 px.</text><circle cx="513" cy="217.89999999999998" r="3" fill="#7B283A"/><text x="528" y="222.89999999999998" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Рубрика находится слева. Заголовок и иллюстрация не</text><text x="528" y="244.34999999999997" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">заходят в зону эмблемы.</text><circle cx="513" cy="272.79999999999995" r="3" fill="#7B283A"/><text x="528" y="277.79999999999995" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Сохраняем пропорции и целый контур, включая корону.</text><text x="528" y="299.24999999999994" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Орнамент и надписи не набираются заново.</text><circle cx="513" cy="327.69999999999993" r="3" fill="#7B283A"/><text x="528" y="332.69999999999993" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">При изменении размера карточки проверяем читаемость</text><text x="528" y="354.1499999999999" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">подписи в фактическом масштабе.</text><circle cx="513" cy="382.5999999999999" r="3" fill="#7B283A"/><text x="528" y="387.5999999999999" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Отдельный упрощённый знак для малого размера в этой</text><text x="528" y="409.0499999999999" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">версии не утверждается.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">07</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Гранат и апельсин сохраняются"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">СИМВОЛЫ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Гранат и апельсин сохраняются</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Обновление иллюстративной техники не меняет символы проекта.</text><image href="assets/images/logo.png" x="72" y="153" width="280" height="280" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="48" y="462" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Гранат в фирменном знаке</text><text x="48" y="498" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Апельсин остаётся вторым символом. Оба</text><text x="48" y="519" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">плода могут быть отдельным акцентом по</text><text x="48" y="540" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">смыслу публикации.</text><text x="437" y="170" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">В новой серии больше воздуха</text><text x="437" y="209" fill="#32272B" font-family="FR" font-size="17" text-anchor="start">Сплошная фруктово-ботаническая рамка больше не является</text><text x="437" y="233.31" fill="#32272B" font-family="FR" font-size="17" text-anchor="start">обязательной основой соцсетей. Центральный текст и один</text><text x="437" y="257.62" fill="#32272B" font-family="FR" font-size="17" text-anchor="start">главный рисунок получают самостоятельное место.</text><text x="437" y="351" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Предмет урока и символ бренда</text><text x="437" y="390" fill="#32272B" font-family="FR" font-size="17" text-anchor="start">Тыква, чашка, маска или одежда иллюстрируют конкретное</text><text x="437" y="414.31" fill="#32272B" font-family="FR" font-size="17" text-anchor="start">слово. Они не заменяют гранат и апельсин в символике</text><text x="437" y="438.62" fill="#32272B" font-family="FR" font-size="17" text-anchor="start">проекта. Листья и ветви поддерживают сюжет только по</text><text x="437" y="462.93" fill="#32272B" font-family="FR" font-size="17" text-anchor="start">необходимости.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">08</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Три шрифта, понятные роли"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ТИПОГРАФИКА</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Три шрифта, понятные роли</text><rect x="48" y="144" width="904" height="116" rx="16" fill="#F4EBDD" stroke="none" stroke-width="1"/><text x="68" y="186" fill="#7B283A" font-family="FB" font-size="30" text-anchor="start">Rubik</text><text x="68" y="226" fill="#32272B" font-family="FR" font-size="21" text-anchor="start">Иврит для жизни</text><text x="460" y="181" fill="#7B283A" font-family="FB" font-size="19" text-anchor="start">Соцсети и учебные слайды</text><text x="460" y="214" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Заголовки 700. Текст 400-500.</text><rect x="48" y="277" width="904" height="116" rx="16" fill="#F3E5C9" stroke="none" stroke-width="1"/><text x="68" y="319" fill="#7B283A" font-family="FUB" font-size="30" text-anchor="start">Ubuntu</text><text x="68" y="359" fill="#32272B" font-family="FU" font-size="21" text-anchor="start">Иврит для жизни</text><text x="460" y="314" fill="#7B283A" font-family="FB" font-size="19" text-anchor="start">Сайт: заголовки</text><text x="460" y="347" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Короткие заголовки и крупные смысловые акценты.</text><rect x="48" y="410" width="904" height="116" rx="16" fill="#E3E2C6" stroke="none" stroke-width="1"/><text x="68" y="452" fill="#7B283A" font-family="FMB" font-size="30" text-anchor="start">Montserrat</text><text x="68" y="492" fill="#32272B" font-family="FMR" font-size="21" text-anchor="start">Иврит для жизни</text><text x="460" y="447" fill="#7B283A" font-family="FB" font-size="19" text-anchor="start">Сайт: основной текст</text><text x="460" y="480" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Абзацы, подписи, навигация и элементы интерфейса.</text><text x="48" y="566" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Надпись внутри логотипа является частью готового рисунка. Её не набирают Rubik, Ubuntu или Montserrat заново.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">09</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Размеры: соцсети и сайт"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ТИПОГРАФИКА</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Размеры: соцсети и сайт</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Размеры соцсетей приведены для макета 1080 × 1440 из принятого шаблона.</text><text x="48" y="160" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Соцсети / Rubik</text><text x="48" y="214" fill="#7B283A" font-family="FM" font-size="16" text-anchor="start">Заголовок обложки</text><text x="48" y="237" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">113 px Bold; акцентная строка 112 px</text><text x="48" y="271" fill="#7B283A" font-family="FM" font-size="16" text-anchor="start">Иврит на карточке слова</text><text x="48" y="294" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">до 166 px Bold; по реальной ширине</text><text x="48" y="328" fill="#7B283A" font-family="FM" font-size="16" text-anchor="start">Транскрипция</text><text x="48" y="351" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">61 px Medium / #A35332</text><text x="48" y="385" fill="#7B283A" font-family="FM" font-size="16" text-anchor="start">Перевод</text><text x="48" y="408" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">54 px Regular / #66513C</text><text x="48" y="442" fill="#7B283A" font-family="FM" font-size="16" text-anchor="start">Рубрика и футер</text><text x="48" y="465" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">25 px; футер 22-26 px</text><text x="548" y="160" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Сайт</text><text x="548" y="214" fill="#7B283A" font-family="FM" font-size="16" text-anchor="start">H1 / Ubuntu 700</text><text x="548" y="237" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">40-56 px; мобильный 30-38 px</text><text x="548" y="271" fill="#7B283A" font-family="FM" font-size="16" text-anchor="start">H2 / Ubuntu 500-700</text><text x="548" y="294" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">28-36 px; мобильный 24-30 px</text><text x="548" y="328" fill="#7B283A" font-family="FM" font-size="16" text-anchor="start">Текст / Montserrat 400</text><text x="548" y="351" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">18 px; мобильный от 16 px</text><text x="548" y="385" fill="#7B283A" font-family="FM" font-size="16" text-anchor="start">Подпись / Montserrat 400</text><text x="548" y="408" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">14-16 px</text><text x="548" y="442" fill="#7B283A" font-family="FM" font-size="16" text-anchor="start">Межстрочный интервал</text><text x="548" y="465" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Текст 1,45-1,6; заголовки 1,1-1,2</text><text x="48" y="553" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Длинный перевод переносится на две строки. Иврит уменьшается только по фактической ширине. Масштаб отдельных надписей не должен вытеснять рисунок и</text><text x="48" y="568" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">футер.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">10</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Иврит, транскрипция, перевод"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ИВРИТ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Иврит, транскрипция, перевод</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Образец оформления для соцсетей и справочных материалов. В тетради действуют отдельные ограничения.</text><rect x="48" y="151" width="289" height="186" rx="0" fill="#FFF9EF" stroke="#E5CDAE" stroke-width="1"/><text x="193" y="216" fill="#7B283A" font-family="FB" font-size="42" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">שלום</text><text x="193" y="263" fill="#A35332" font-family="FM" font-size="22" text-anchor="middle">[шалОм]</text><text x="193" y="306" fill="#66513C" font-family="FR" font-size="19" text-anchor="middle">Здравствуйте</text><rect x="355" y="151" width="289" height="186" rx="0" fill="#FFF9EF" stroke="#E5CDAE" stroke-width="1"/><text x="500" y="216" fill="#7B283A" font-family="FB" font-size="42" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">תודה</text><text x="500" y="263" fill="#A35332" font-family="FM" font-size="22" text-anchor="middle">[тодА]</text><text x="500" y="306" fill="#66513C" font-family="FR" font-size="19" text-anchor="middle">Спасибо</text><rect x="662" y="151" width="289" height="186" rx="0" fill="#FFF9EF" stroke="#E5CDAE" stroke-width="1"/><text x="807" y="216" fill="#7B283A" font-family="FB" font-size="42" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">בוקר טוב</text><text x="807" y="263" fill="#A35332" font-family="FM" font-size="22" text-anchor="middle">[бОкер тов]</text><text x="807" y="306" fill="#66513C" font-family="FR" font-size="19" text-anchor="middle">Доброе утро</text><circle cx="51" cy="374" r="3" fill="#7B283A"/><text x="66" y="379" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Иврит хранится в логическом Unicode-порядке и выводится справа налево. Русский текст и транскрипция идут слева направо.</text><circle cx="51" cy="404.02" r="3" fill="#7B283A"/><text x="66" y="409.02" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Огласовки, знаки препинания и формы мужского/женского рода проверяются отдельно. Межбуквенный интервал для иврита не</text><text x="66" y="429.03999999999996" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">увеличиваем.</text><circle cx="51" cy="454.05999999999995" r="3" fill="#7B283A"/><text x="66" y="459.05999999999995" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Буквы и учебные подписи набираем точным текстом поверх изображения. Не используем сгенерированные рисунком надписи</text><text x="66" y="479.0799999999999" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">как учебный оригинал.</text><circle cx="51" cy="504.0999999999999" r="3" fill="#7B283A"/><text x="66" y="509.0999999999999" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Для иврита на сайте можно подключать Rubik отдельным языковым стилем: в использованном файле проверены буквы</text><text x="66" y="529.1199999999999" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">примеров. Огласовки требуют отдельной визуальной проверки.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">11</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Обложка: текст и одна сцена"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">СОЦСЕТИ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Обложка: текст и одна сцена</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Пример макета из принятого скилла. Сезонное содержание показано только как пример.</text><image href="assets/images/cover.png" x="48" y="145" width="310" height="414" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="407" y="169" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Верх: рубрика и эмблема</text><text x="407" y="207" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Логотип справа сверху, короткая рубрика слева. Большое светлое поле</text><text x="407" y="228.45" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">#FFF5E4 и едва заметное зерно бумаги.</text><text x="407" y="304" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Центр: крупный заголовок</text><text x="407" y="342" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Rubik Bold. Основная строка бордовая, акцентная терракотовая. Короткая</text><text x="407" y="363.45" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">поясняющая строка расположена ниже и не спорит с заголовком.</text><text x="407" y="439" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Низ: иллюстрация и футер</text><text x="407" y="477" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Одна сцена в нижней области. Под ней отдельный футер: @ivrit_ivrika,</text><text x="407" y="498.45" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">ivrika.ru, счётчик и стрелка. Тема и число слов задаются текущим</text><text x="407" y="519.9" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">заданием.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">12</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Словарная карточка: один предмет"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">СОЦСЕТИ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Словарная карточка: один предмет</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Формат по умолчанию 1080 × 1440 (3:4). Другое порученное соотношение сторон имеет приоритет.</text><image href="assets/images/word.png" x="48" y="145" width="310" height="414" preserveAspectRatio="xMidYMid meet" opacity="1"/><circle cx="410" cy="164" r="3" fill="#7B283A"/><text x="425" y="169" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Фон #FFF9EF. Логотип справа сверху и единая рубрика. Все надписи</text><text x="425" y="190.45" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">набраны отдельными точными слоями.</text><circle cx="410" cy="218.89999999999998" r="3" fill="#7B283A"/><text x="425" y="223.89999999999998" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Иврит начинается около y=253, кегль до 166 px. Транскрипция около</text><text x="425" y="245.34999999999997" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">y=479, 61 px; перевод около y=583, 54 px.</text><circle cx="410" cy="273.79999999999995" r="3" fill="#7B283A"/><text x="425" y="278.79999999999995" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Арт ориентировочно x=148, y=768, 784 × 523 px. В нём один узнаваемый</text><text x="425" y="300.24999999999994" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">предмет и только необходимые детали.</text><circle cx="410" cy="328.69999999999993" r="3" fill="#7B283A"/><text x="425" y="333.69999999999993" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Одна фигурка рода находится справа снизу над футером. Она</text><text x="425" y="355.1499999999999" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">относится к слову, а не к полу персонажа на рисунке.</text><circle cx="410" cy="383.5999999999999" r="3" fill="#7B283A"/><text x="425" y="388.5999999999999" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Футер, тонкий разделитель, номер и стрелка сохраняют одно место во</text><text x="425" y="410.0499999999999" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">всей серии.</text><text x="48" y="557" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Тыква здесь является эталоном техники и предметной карточки. Её не добавляют к другим словам автоматически.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">13</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Небольшая сцена Израиля"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ИЛЛЮСТРАЦИИ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Небольшая сцена Израиля</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Светлая самостоятельная сцена поддерживает тему. Фон самой карточки остаётся кремовым.</text><image href="assets/images/jerusalem.png" x="48" y="168" width="574" height="383" preserveAspectRatio="xMidYMid meet" opacity="1"/><circle cx="662" cy="160" r="3" fill="#7B283A"/><text x="677" y="165" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Один узнаваемый контекст: море, Яффа,</text><text x="677" y="185.02" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Иерусалим или бытовой фасад.</text><circle cx="662" cy="210.04000000000002" r="3" fill="#7B283A"/><text x="677" y="215.04000000000002" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Несколько крупных форм вместо</text><text x="677" y="235.06000000000003" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">подробной туристической панорамы.</text><circle cx="662" cy="260.08000000000004" r="3" fill="#7B283A"/><text x="677" y="265.08000000000004" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Узкая полоса моря, каменная арка или</text><text x="677" y="285.1" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">компактный силуэт архитектуры.</text><circle cx="662" cy="310.12" r="3" fill="#7B283A"/><text x="677" y="315.12" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Человек или учебный предмет остаётся</text><text x="677" y="335.14" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">главным. Пальмы, флаги, толпа и</text><text x="677" y="355.15999999999997" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">сувениры не добавляются</text><text x="677" y="375.17999999999995" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">автоматически.</text><circle cx="662" cy="400.19999999999993" r="3" fill="#7B283A"/><text x="677" y="405.19999999999993" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Неизвестную архитектуру сверяют с</text><text x="677" y="425.2199999999999" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">источником или выбирают простой</text><text x="677" y="445.2399999999999" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">бытовой контекст.</text><text x="48" y="557" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Отдельный арт часто 3:2; примерно 5-8% чистого пространства по краям. Волосы, ноги, листья и аксессуары целиком помещаются в кадре.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">14</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Цвета внутри иллюстрации"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ЦВЕТ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Цвета внутри иллюстрации</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Светлый средиземноморский колорит. Акценты не превращают всю карточку в цветной фон.</text><rect x="48" y="145" width="214" height="87" rx="0" fill="#F19961" stroke="none" stroke-width="1"/><text x="48" y="260" fill="#7B283A" font-family="FM" font-size="17" text-anchor="start">Абрикосовый</text><text x="48" y="287" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">#F19961</text><rect x="278" y="145" width="214" height="87" rx="0" fill="#E98B43" stroke="none" stroke-width="1"/><text x="278" y="260" fill="#7B283A" font-family="FM" font-size="17" text-anchor="start">Яркий предмет</text><text x="278" y="287" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">#E98B43</text><rect x="508" y="145" width="214" height="87" rx="0" fill="#D97843" stroke="none" stroke-width="1"/><text x="508" y="260" fill="#7B283A" font-family="FM" font-size="17" text-anchor="start">Терракота</text><text x="508" y="287" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">#D97843</text><rect x="738" y="145" width="214" height="87" rx="0" fill="#EED7AB" stroke="none" stroke-width="1"/><text x="738" y="260" fill="#7B283A" font-family="FM" font-size="17" text-anchor="start">Песок</text><text x="738" y="287" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">#EED7AB</text><rect x="48" y="317" width="214" height="87" rx="0" fill="#A8AD63" stroke="none" stroke-width="1"/><text x="48" y="432" fill="#7B283A" font-family="FM" font-size="17" text-anchor="start">Олива</text><text x="48" y="459" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">#A8AD63</text><rect x="278" y="317" width="214" height="87" rx="0" fill="#93995A" stroke="none" stroke-width="1"/><text x="278" y="432" fill="#7B283A" font-family="FM" font-size="17" text-anchor="start">Тёмная олива</text><text x="278" y="459" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">#93995A</text><rect x="508" y="317" width="214" height="87" rx="0" fill="#68AFAE" stroke="none" stroke-width="1"/><text x="508" y="432" fill="#7B283A" font-family="FM" font-size="17" text-anchor="start">Полоса моря</text><text x="508" y="459" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">#68AFAE</text><rect x="738" y="317" width="214" height="87" rx="0" fill="#7B283A" stroke="none" stroke-width="1"/><text x="738" y="432" fill="#7B283A" font-family="FM" font-size="17" text-anchor="start">Бордовый</text><text x="738" y="459" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">#7B283A</text><text x="48" y="518" fill="#7B283A" font-family="FB" font-size="20" text-anchor="start">Бордовый в повседневной сцене</text><text x="48" y="549" fill="#32272B" font-family="FR" font-size="13" text-anchor="start">Сосредоточен в волосах, резных контурах и небольших деталях. Большая тёмная масса одежды не должна поглощать светлый рисунок.</text><text x="48" y="567" fill="#32272B" font-family="FR" font-size="13" text-anchor="start">Голубой и розовый пиктограмм рода имеют отдельную служебную роль.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">15</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Род слова: одна готовая фигурка"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">СОЦСЕТИ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Род слова: одна готовая фигурка</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Точная форма и цвета берутся из пиктограмм проекта.</text><rect x="48" y="150" width="438" height="310" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><rect x="510" y="150" width="442" height="310" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><image href="assets/images/female.svg" x="214" y="185" width="104" height="226" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="assets/images/male.svg" x="677" y="185" width="104" height="226" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="267" y="438" fill="#7B283A" font-family="FB" font-size="20" text-anchor="middle">Женский род / #FF8E92</text><text x="731" y="438" fill="#7B283A" font-family="FB" font-size="20" text-anchor="middle">Мужской род / #A7E5F8</text><text x="48" y="499" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">На карточке слова показывают только нужную фигурку: ориентир 32 × 82 px, справа снизу над футером. Род</text><text x="48" y="522" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">определяется словом; сомнительную форму проверяют по словарю.</text><text x="48" y="559" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Без надписей «ж. р.» / «м. р.», символов ♀ / ♂, эмодзи и круглой подложки. Пиктограммы не перекрашиваются в бордовый.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">16</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Наша повторяющаяся пара"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ПЕРСОНАЖИ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Наша повторяющаяся пара</text><text x="48" y="116" fill="#615B60" font-family="FR" font-size="13" text-anchor="start">Основной пример: принятая кудрявая пара в кафе. Лица и характерные детали сохраняются между сценами.</text><image href="assets/images/cafe.png" x="48" y="170" width="556" height="371" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="646" y="166" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Женщина</text><text x="646" y="204" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Взрослая, с естественными тёмными</text><text x="646" y="225" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">кудрями до шеи или плеч. Круглая</text><text x="646" y="246" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">оранжевая серьга. Кремовая льняная блуза</text><text x="646" y="267" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">и свободная терракотовая юбка.</text><text x="646" y="336" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Мужчина</text><text x="646" y="374" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">Короткие кудри с лёгкой сединой, щетина,</text><text x="646" y="395" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">тонкие круглые бордовые очки. Оливковая</text><text x="646" y="416" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">футболка, светлые льняные шорты и</text><text x="646" y="437" fill="#32272B" font-family="FR" font-size="14" text-anchor="start">сандалии.</text><text x="48" y="557" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Одна понятная бытовая ситуация и естественные жесты. Взрослые пропорции, обычный размер глаз, целые кисти и стопы. Опора для сцены в кафе: cafe.png; для</text><text x="48" y="572" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">других ситуаций сохраняем ту же идентичность.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">17</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Как выглядит сухая печать"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ТЕХНИКА</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Как выглядит сухая печать</text><image href="assets/images/cafe.png" x="48" y="157" width="438" height="292" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="48" y="491" fill="#7B283A" font-family="FM" font-size="17" text-anchor="start">Узнаваемость должна сохраняться без текста,</text><text x="48" y="515" fill="#7B283A" font-family="FM" font-size="17" text-anchor="start">логотипа и фирменного футера.</text><circle cx="535" cy="163" r="3" fill="#7B283A"/><text x="550" y="168" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Контур слегка неровный и уверенный. Несколько</text><text x="550" y="189.45" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">крупных цветовых плоскостей читаются раньше</text><text x="550" y="210.89999999999998" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">деталей.</text><circle cx="535" cy="239.34999999999997" r="3" fill="#7B283A"/><text x="550" y="244.34999999999997" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Объём и материал передаются резными светлыми</text><text x="550" y="265.79999999999995" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">прорезями, соседними тонами и сухим зерном.</text><circle cx="535" cy="294.24999999999994" r="3" fill="#7B283A"/><text x="550" y="299.24999999999994" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Это плоская печатная графика. У деталей нет толщины</text><text x="550" y="320.69999999999993" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">картона, бумажных теней и белого контура наклейки.</text><circle cx="535" cy="349.1499999999999" r="3" fill="#7B283A"/><text x="550" y="354.1499999999999" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Для соцсетей не используются гладкий вектор,</text><text x="550" y="375.5999999999999" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">акварель, пластилин, глянцевый 3D и детская</text><text x="550" y="397.0499999999999" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">мультяшность.</text><circle cx="535" cy="425.4999999999999" r="3" fill="#7B283A"/><text x="550" y="430.4999999999999" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">Окружение арта обычно прозрачное. Светлые части</text><text x="550" y="451.9499999999999" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">лица и одежды остаются заполненными; края</text><text x="550" y="473.39999999999986" fill="#32272B" font-family="FR" font-size="15" text-anchor="start">проверяют на настоящем кремовом фоне.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">18</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Польза обучения: пример в новом стиле"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ПРЕЗЕНТАЦИИ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Польза обучения: пример в новом стиле</text><svg x="48" y="145" width="414" height="414" viewBox="0 0 1080 1080" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#FFF5E4" stroke="none" stroke-width="1"/><text x="72" y="82" fill="#7B283A" font-family="FM" font-size="20" text-anchor="start">ИВРИКА / УЧЕБНЫЙ СЛАЙД</text><image href="assets/images/logo.png" x="918" y="38" width="114" height="114" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="72" y="179" fill="#7B283A" font-family="FB" font-size="62" text-anchor="start">Что даёт</text><text x="72" y="251" fill="#7B283A" font-family="FB" font-size="62" text-anchor="start">обучение на курсе</text><image href="assets/images/cafe.png" x="756" y="172" width="246" height="164" preserveAspectRatio="xMidYMid meet" opacity="1"/><rect x="72" y="350" width="456" height="178" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><line x1="72" y1="350" x2="120" y2="350" stroke="#C56535" stroke-width="4" stroke-linecap="round"/><text x="94" y="389" fill="#C56535" font-family="FM" font-size="20" text-anchor="start">01</text><text x="149" y="393" fill="#7B283A" font-family="FB" font-size="34" text-anchor="start">Понятный план</text><text x="96" y="466" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">Знаете, что изучать</text><text x="96" y="501" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">и как двигаться дальше</text><rect x="552" y="350" width="456" height="178" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><line x1="552" y1="350" x2="600" y2="350" stroke="#C56535" stroke-width="4" stroke-linecap="round"/><text x="574" y="389" fill="#C56535" font-family="FM" font-size="20" text-anchor="start">02</text><text x="629" y="393" fill="#7B283A" font-family="FB" font-size="34" text-anchor="start">Речь с первого</text><text x="629" y="432" fill="#7B283A" font-family="FB" font-size="34" text-anchor="start">урока</text><text x="576" y="466" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">Тренируете произношение</text><text x="576" y="501" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">и навык говорения</text><rect x="72" y="553" width="456" height="178" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><line x1="72" y1="553" x2="120" y2="553" stroke="#C56535" stroke-width="4" stroke-linecap="round"/><text x="94" y="592" fill="#C56535" font-family="FM" font-size="20" text-anchor="start">03</text><text x="149" y="596" fill="#7B283A" font-family="FB" font-size="34" text-anchor="start">Слова во фразах</text><text x="96" y="669" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">Набираете лексику</text><text x="96" y="704" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">и применяете её в речи</text><rect x="552" y="553" width="456" height="178" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><line x1="552" y1="553" x2="600" y2="553" stroke="#C56535" stroke-width="4" stroke-linecap="round"/><text x="574" y="592" fill="#C56535" font-family="FM" font-size="20" text-anchor="start">04</text><text x="629" y="596" fill="#7B283A" font-family="FB" font-size="34" text-anchor="start">Глаголы и предлоги</text><text x="576" y="669" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">Разбираетесь в формах</text><text x="576" y="704" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">и строите свои фразы</text><rect x="72" y="758" width="936" height="162" rx="0" fill="#EED7AB" stroke="none" stroke-width="1"/><text x="96" y="808" fill="#C56535" font-family="FM" font-size="22" text-anchor="start">05</text><text x="174" y="810" fill="#7B283A" font-family="FB" font-size="40" text-anchor="start">Задания и практика</text><text x="174" y="864" fill="#66513C" font-family="FR" font-size="30" text-anchor="start">Запоминаете материал и закрепляете знания</text><line x1="72" y1="1005" x2="1008" y2="1005" stroke="#E5CDAE" stroke-width="2" stroke-linecap="round"/><text x="72" y="1047" fill="#7B283A" font-family="FR" font-size="23" text-anchor="start">@ivrit_ivrika</text><text x="834" y="1047" fill="#94795E" font-family="FR" font-size="22" text-anchor="start">ivrika.ru</text><text x="1008" y="1047" fill="#7B283A" font-family="FR" font-size="22" text-anchor="end">01 / 04</text></svg><text x="506" y="177" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Сохраняем содержание</text><text x="506" y="216" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Те же пять смысловых блоков из первоначального</text><text x="506" y="238.88" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">примера. Крупный заголовок, короткое объяснение и</text><text x="506" y="261.76" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">отдельный итоговый блок.</text><text x="506" y="351" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Меняем визуальную подачу</text><text x="506" y="390" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Кремовый фон, бордовая типографика, терракотовые</text><text x="506" y="412.88" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">номера и тонкие акценты. Печатная сцена с кудрявой</text><text x="506" y="435.76" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">парой поддерживает разговорную тему.</text><text x="48" y="562" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Квадратный макет 1080 × 1080. Иллюстрация не перекрывает заголовок, логотип и смысловые блоки.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">19</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Речевой пример: вопрос и ответы"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ПРЕЗЕНТАЦИИ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Речевой пример: вопрос и ответы</text><svg x="48" y="145" width="414" height="414" viewBox="0 0 1080 1080" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#FFF5E4" stroke="none" stroke-width="1"/><text x="72" y="82" fill="#7B283A" font-family="FM" font-size="20" text-anchor="start">ИВРИКА / УЧЕБНЫЙ СЛАЙД</text><image href="assets/images/logo.png" x="918" y="38" width="114" height="114" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="72" y="179" fill="#7B283A" font-family="FB" font-size="58" text-anchor="start">Как начать отвечать</text><text x="72" y="248" fill="#7B283A" font-family="FB" font-size="58" text-anchor="start">на иврите?</text><image href="assets/images/cafe.png" x="765" y="173" width="239" height="160" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="72" y="327" fill="#C56535" font-family="FB" font-size="42" text-anchor="start">Как дела?</text><rect x="72" y="361" width="456" height="212" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="300" y="404" fill="#7B283A" font-family="FM" font-size="30" text-anchor="middle">К мужчине</text><text x="300" y="479" fill="#7B283A" font-family="FB" font-size="60" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">מַה שְׁלוֹמְךָ?</text><text x="300" y="534" fill="#A35332" font-family="FM" font-size="31" text-anchor="middle">ма шломхА?</text><rect x="552" y="361" width="456" height="212" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="780" y="404" fill="#7B283A" font-family="FM" font-size="30" text-anchor="middle">К женщине</text><text x="780" y="479" fill="#7B283A" font-family="FB" font-size="60" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">מַה שְׁלוֹמֵךְ?</text><text x="780" y="534" fill="#A35332" font-family="FM" font-size="31" text-anchor="middle">ма шломЭх?</text><rect x="72" y="611" width="296" height="164" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="220" y="673" fill="#7B283A" font-family="FB" font-size="57" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">טוֹב</text><text x="220" y="717" fill="#A35332" font-family="FM" font-size="28" text-anchor="middle">тов</text><text x="220" y="754" fill="#66513C" font-family="FR" font-size="27" text-anchor="middle">Хорошо</text><rect x="392" y="611" width="296" height="164" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="540" y="673" fill="#7B283A" font-family="FB" font-size="57" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">בְּסֵדֶר</text><text x="540" y="717" fill="#A35332" font-family="FM" font-size="28" text-anchor="middle">бесЭдер</text><text x="540" y="754" fill="#66513C" font-family="FR" font-size="27" text-anchor="middle">Нормально</text><rect x="712" y="611" width="296" height="164" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><text x="860" y="673" fill="#7B283A" font-family="FB" font-size="57" text-anchor="middle" lang="he" xml:lang="he" direction="rtl" unicode-bidi="isolate">תּוֹדָה</text><text x="860" y="717" fill="#A35332" font-family="FM" font-size="28" text-anchor="middle">тодА</text><text x="860" y="754" fill="#66513C" font-family="FR" font-size="27" text-anchor="middle">Спасибо</text><line x1="72" y1="819" x2="1008" y2="819" stroke="#C56535" stroke-width="3" stroke-linecap="round"/><text x="72" y="877" fill="#7B283A" font-family="FB" font-size="37" text-anchor="start">Послушайте вопрос и ответьте вслух</text><line x1="72" y1="1005" x2="1008" y2="1005" stroke="#E5CDAE" stroke-width="2" stroke-linecap="round"/><text x="72" y="1047" fill="#7B283A" font-family="FR" font-size="23" text-anchor="start">@ivrit_ivrika</text><text x="834" y="1047" fill="#94795E" font-family="FR" font-size="22" text-anchor="start">ivrika.ru</text><text x="1008" y="1047" fill="#7B283A" font-family="FR" font-size="22" text-anchor="end">02 / 04</text></svg><text x="506" y="177" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Ясная учебная иерархия</text><text x="506" y="216" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Вопрос к мужчине и к женщине разделён на две</text><text x="506" y="238.88" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">колонки. Иврит крупнее транскрипции. Ответы</text><text x="506" y="261.76" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">выровнены в один ряд.</text><text x="506" y="351" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Действие в конце</text><text x="506" y="390" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Внизу одна инструкция: послушать вопрос и ответить</text><text x="506" y="412.88" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">вслух. Печатная сцена кафе задаёт контекст, а не</text><text x="506" y="435.76" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">заменяет учебные подписи.</text><text x="48" y="562" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">Иврит, огласовки, транскрипция и русский текст остаются отдельными редактируемыми элементами.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">20</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Учебная схема: четыре навыка"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ПРЕЗЕНТАЦИИ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Учебная схема: четыре навыка</text><svg x="48" y="145" width="414" height="414" viewBox="0 0 1080 1080" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#FFF5E4" stroke="none" stroke-width="1"/><text x="72" y="82" fill="#7B283A" font-family="FM" font-size="20" text-anchor="start">ИВРИКА / УЧЕБНЫЙ СЛАЙД</text><image href="assets/images/logo.png" x="918" y="38" width="114" height="114" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="72" y="179" fill="#7B283A" font-family="FB" font-size="56" text-anchor="start">Нужно ли сначала</text><text x="72" y="249" fill="#7B283A" font-family="FB" font-size="56" text-anchor="start">выучить весь алфавит?</text><image href="assets/images/pair.png" x="823" y="172" width="185" height="123" preserveAspectRatio="xMidYMid meet" opacity="1"/><rect x="72" y="341" width="456" height="181" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><line x1="72" y1="341" x2="120" y2="341" stroke="#C56535" stroke-width="4" stroke-linecap="round"/><text x="94" y="380" fill="#C56535" font-family="FM" font-size="20" text-anchor="start">01</text><text x="149" y="384" fill="#7B283A" font-family="FB" font-size="34" text-anchor="start">Чтение</text><text x="96" y="457" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">Узнаём написанные слова</text><rect x="552" y="341" width="456" height="181" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><line x1="552" y1="341" x2="600" y2="341" stroke="#C56535" stroke-width="4" stroke-linecap="round"/><text x="574" y="380" fill="#C56535" font-family="FM" font-size="20" text-anchor="start">02</text><text x="629" y="384" fill="#7B283A" font-family="FB" font-size="34" text-anchor="start">Слушание</text><text x="576" y="457" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">Различаем слова на слух</text><rect x="72" y="547" width="456" height="181" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><line x1="72" y1="547" x2="120" y2="547" stroke="#C56535" stroke-width="4" stroke-linecap="round"/><text x="94" y="586" fill="#C56535" font-family="FM" font-size="20" text-anchor="start">03</text><text x="149" y="590" fill="#7B283A" font-family="FB" font-size="34" text-anchor="start">Понимание</text><text x="96" y="663" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">Связываем слова</text><text x="96" y="698" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">со смыслом</text><rect x="552" y="547" width="456" height="181" rx="0" fill="#FFF9EF" stroke="none" stroke-width="1"/><line x1="552" y1="547" x2="600" y2="547" stroke="#C56535" stroke-width="4" stroke-linecap="round"/><text x="574" y="586" fill="#C56535" font-family="FM" font-size="20" text-anchor="start">04</text><text x="629" y="590" fill="#7B283A" font-family="FB" font-size="34" text-anchor="start">Речь</text><text x="576" y="663" fill="#66513C" font-family="FR" font-size="27" text-anchor="start">Пробуем отвечать</text><rect x="72" y="778" width="936" height="164" rx="0" fill="#EED7AB" stroke="none" stroke-width="1"/><text x="96" y="831" fill="#7B283A" font-family="FB" font-size="36" text-anchor="start">Слушать и говорить можно уже сейчас</text><text x="96" y="889" fill="#66513C" font-family="FR" font-size="30" text-anchor="start">Чтение будем осваивать постепенно</text><line x1="72" y1="1005" x2="1008" y2="1005" stroke="#E5CDAE" stroke-width="2" stroke-linecap="round"/><text x="72" y="1047" fill="#7B283A" font-family="FR" font-size="23" text-anchor="start">@ivrit_ivrika</text><text x="834" y="1047" fill="#94795E" font-family="FR" font-size="22" text-anchor="start">ivrika.ru</text><text x="1008" y="1047" fill="#7B283A" font-family="FR" font-size="22" text-anchor="end">03 / 04</text></svg><text x="506" y="177" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Четыре понятных блока</text><text x="506" y="216" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Чтение, слушание, понимание и речь занимают равные</text><text x="506" y="238.88" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">позиции. Нумерация и единая сетка помогают</text><text x="506" y="261.76" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">проследить логику.</text><text x="506" y="351" fill="#7B283A" font-family="FB" font-size="24" text-anchor="start">Вывод выделен площадью</text><text x="506" y="390" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">Песочная полоса завершает схему. Светлый фон,</text><text x="506" y="412.88" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">спокойные подложки и минимум декора сохраняют</text><text x="506" y="435.76" fill="#32272B" font-family="FR" font-size="16" text-anchor="start">внимание на учебном смысле.</text><text x="48" y="562" fill="#615B60" font-family="FR" font-size="11" text-anchor="start">В новом оформлении нет прежних глянцевых иконок и рукописных синих пометок. Содержание исходного примера сохранено.</text><line x1="48" y1="586" x2="952" y2="586" stroke="#F4EBDD" stroke-width="1" stroke-linecap="round"/><text x="48" y="605" fill="#615B60" font-family="FM" font-size="9" text-anchor="start">ИВРИКА / БРЕНДБУК / 01.11.2026</text><text x="952" y="605" fill="#7B283A" font-family="FM" font-size="10" text-anchor="end">21</text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-label="Широкий экран: адаптация 16:9"><rect x="0" y="0" width="1000" height="625" rx="0" fill="#FAF6ED" stroke="none" stroke-width="1"/><text x="48" y="32" fill="#7B283A" font-family="FB" font-size="11" text-anchor="start">ИВРИКА</text><text x="132" y="32" fill="#615B60" font-family="FM" font-size="10" text-anchor="start">ПРЕЗЕНТАЦИИ</text><text x="48" y="88" fill="#7B283A" font-family="FB" font-size="32" text-anchor="start">Широкий экран: адаптация 16:9</text><svg x="48" y="148" width="640" height="360" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FFF5E4" stroke="none" stroke-width="1"/><image href="assets/images/logo.png" x="1730" y="54" width="130" height="130" preserveAspec
